name: Run unittests

on:
  push:
    branches:
      - main
      - dev-install
  pull_request:
    branches:
      - main
      - dev-install

  workflow_dispatch:

jobs:
  # Eryn modernization (2026-06-04): ruff lint + format-check step.
  # Runs in parallel with the install_and_run_tests matrix below.
  ruff:
    name: Ruff lint + format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "ruff>=0.9.0"
      - name: Run ruff check
        run: ruff check src/eryn
      - name: Run ruff format --check
        run: ruff format --check src/eryn

  install_and_run_tests:
    name: Install and run tests
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      # Eryn modernization (2026-06-04): expand matrix to all supported
      # Python versions (3.10..3.13 matching `requires-python` in
      # pyproject.toml). Pre-3M the matrix was 3.12-only.
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - name: Install package
        run: |
          which python
          python --version
          python -m pip install -v .
      # Eryn modernization (2026-06-04): coverage steps re-enabled (were
      # commented out pre-modernization). Coverage report posted to job
      # log; future work can wire up coveralls/codecov upload.
      - name: Install coverage
        run: |
          python -m pip install coverage[toml]
      - name: Run module tests & show coverage results
        run: |
          coverage run --source=eryn -m unittest discover
          coverage report -m
